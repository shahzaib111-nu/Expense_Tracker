spring.application.name=ExpenseTracker

# Server
server.port=8080

# ====================================================
# MySQL Database Configuration
# ====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/myapp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Import secret configuration
spring.config.import=optional:classpath:config.yaml

# ====================================================
# JPA / Hibernate
# ====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG

# Email Service
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# API Documentation
springdoc.api-docs.path=/v3/api-docs
scalar.enabled=true
scalar.url=/v3/api-docs