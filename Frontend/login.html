<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · Expense Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }

  .auth-bg {
    background: linear-gradient(
      -45deg,
      #ecfdf5,
      #a7f3d0,
      #67e8f9,
      #bfdbfe,
      #ddd6fe
    );
    background-size: 400% 400%;
    animation: gradientFlow 15s ease infinite;
  }

  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>
</head>
<body class="auth-bg min-h-screen flex items-center justify-center px-3 py-6 sm:p-4">

  <div class="relative z-10 w-full max-w-md">

    <div class="flex flex-col items-center mb-5 sm:mb-6">
      <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br from-blue-500 to-sky-600 flex items-center justify-center text-white text-[0px] shadow-lg shadow-blue-200 mb-3">
        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 8.5A3.5 3.5 0 0 1 8.5 5H18a2 2 0 0 1 2 2v10.5a2.5 2.5 0 0 1-2.5 2.5h-9A3.5 3.5 0 0 1 5 16.5v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8.5 5A3.5 3.5 0 0 0 5 8.5 3.5 3.5 0 0 0 8.5 12H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15.5 16h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        ₨
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800 text-center">Expense Tracker</h1>
      <p class="text-sm text-slate-500 mt-1 text-center">Welcome back, log in to continue</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl shadow-slate-200 border border-slate-100 p-5 sm:p-8">

      <h2 class="text-xl font-bold text-slate-800 mb-1">Log in</h2>
      <p class="text-sm text-slate-500 mb-6">Pick up right where you left off.</p>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
          >
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              class="w-full px-4 py-2.5 pr-16 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
            >
            <button
              type="button"
              id="toggleBtn"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-blue-600 hover:text-blue-700"
            >
              SHOW
            </button>
          </div>
        </div>

        <button
          id="submitBtn"
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md shadow-blue-200"
        >
          Log In
        </button>
        <p id="formMessage" class="hidden text-sm mt-3"></p>
      </form>

      <div class="flex items-center gap-3 my-6">
        <div class="h-px flex-1 bg-slate-200"></div>
        <span class="text-xs font-medium text-slate-400">OR</span>
        <div class="h-px flex-1 bg-slate-200"></div>
      </div>

      <div class="space-y-3">
        <button
          type="button"
          id="googleLoginBtn"
          class="w-full flex min-h-11 items-center justify-center gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-blue-200 hover:bg-slate-50 hover:shadow-md sm:px-4"
        >
          <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Continue with Google
        </button>

        <button
          type="button"
          id="githubLoginBtn"
          class="w-full flex min-h-11 items-center justify-center gap-3 rounded-lg border border-slate-800 bg-slate-950 px-3 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-slate-800 hover:shadow-md sm:px-4"
        >
          <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.58.1.79-.25.79-.56v-2.16c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18.92-.26 1.9-.38 2.88-.39.98.01 1.96.13 2.88.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.42-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14v3.16c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
          </svg>
          Continue with GitHub
        </button>
      </div>

      <p class="text-sm text-slate-500 text-center mt-6">
        Don't have an account?
        <a href="signup.html" class="text-blue-600 font-semibold hover:underline">Sign up</a>
      </p>

    </div>

  </div>

  <div id="sessionEndedModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/55 px-3 py-6 backdrop-blur-sm">
    <section class="w-full max-w-md rounded-lg border border-red-100 bg-white p-5 shadow-2xl shadow-slate-900/20 sm:p-6">
      <div class="flex items-start gap-3">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-red-50 text-red-500">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 8v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            <path d="M12 17h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M10.3 4.9 3.2 17.2A2 2 0 0 0 4.9 20h14.2a2 2 0 0 0 1.7-2.8L13.7 4.9a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <div class="min-w-0">
          <h2 class="text-lg font-bold text-slate-900">Session ended</h2>
          <p class="mt-1 text-sm text-slate-500">Your login session is ended. Login again.</p>
        </div>
      </div>

      <div class="mt-5 flex justify-end">
        <button id="confirmSessionEndedBtn" type="button" class="inline-flex min-h-11 items-center justify-center rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white shadow-md shadow-slate-200 transition hover:bg-slate-800">
          OK
        </button>
      </div>
    </section>
  </div>

  <script>
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggleBtn');

    toggleBtn.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleBtn.textContent = isPassword ? 'HIDE' : 'SHOW';
    });

    const LOGIN_API_URL = 'http://localhost:8080/api/auth/login';
    const GOOGLE_OAUTH_URL = 'http://localhost:8080/oauth2/authorization/google';
    const GITHUB_OAUTH_URL = 'http://localhost:8080/oauth2/authorization/github';
    const loginForm = document.getElementById('loginForm');
    const formMessage = document.getElementById('formMessage');
    const submitBtn = document.getElementById('submitBtn');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const githubLoginBtn = document.getElementById('githubLoginBtn');
    const sessionEndedModal = document.getElementById('sessionEndedModal');
    const confirmSessionEndedBtn = document.getElementById('confirmSessionEndedBtn');

    function showMessage(message, type = 'error') {
      formMessage.textContent = message;
      formMessage.className = type === 'success' ? 'text-sm mt-3 text-blue-600 block' : 'text-sm mt-3 text-red-500 block';
    }

    function clearMessage() {
      formMessage.textContent = '';
      formMessage.className = 'hidden text-sm mt-3';
    }

    // --- OPTION B: JWT DECODER HELPER ---
    function parseJwt(token) {
      try {
        if (!token) return null;
        const cleanToken = token.replace(/^Bearer\s+/, '');
        const base64Url = cleanToken.split('.')[1];
        if (!base64Url) return null;
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          window.atob(base64)
            .split('')
            .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        console.error("JWT Decode error:", e);
        return null;
      }
    }

    const loginParams = new URLSearchParams(window.location.search);

    function resolveRedirectTarget() {
      const redirectValue = loginParams.get('redirect') || '';
      const normalized = redirectValue.toLowerCase();
      if (normalized === 'dashboard' || normalized === 'dashboard.html') return 'dashboard.html';
      if (normalized === 'transactions' || normalized === 'transactions.html') return 'transactions.html';
      if (normalized === 'profile' || normalized === 'profile.html') return 'profile.html';
      return 'dashboard.html';
    }

    function getOAuthErrorMessage() {
      const candidates = ['error_description', 'error', 'message', 'oauth_error', 'details'];
      for (const key of candidates) {
        const value = loginParams.get(key);
        if (value) {
          return decodeURIComponent(value.replace(/\+/g, ' '));
        }
      }

      const hash = window.location.hash.replace(/^#/, '');
      if (hash) {
        const hashParams = new URLSearchParams(hash.includes('?') ? hash.slice(hash.indexOf('?') + 1) : hash);
        for (const key of candidates) {
          const value = hashParams.get(key);
          if (value) {
            return decodeURIComponent(value.replace(/\+/g, ' '));
          }
        }
      }

      return '';
    }

    // Show modal if session ended
    if (loginParams.get('session') === 'ended') {
      sessionEndedModal.classList.remove('hidden');
      sessionEndedModal.classList.add('flex');
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Capture OAuth2 token from URL and save it (UPDATED WITH OPTION B)
    let oauthToken = loginParams.get('token');
    if (oauthToken) {
      // Safely remove 'Bearer ' if backend sent it in URL
      oauthToken = oauthToken.replace(/^Bearer\s+/, '');

      localStorage.setItem('jwt', oauthToken);
      localStorage.setItem('authToken', oauthToken);
      
      // Decode JWT to construct user context
      const decodedUser = parseJwt(oauthToken);
      if (decodedUser) {
        const userObj = {
          name: decodedUser.name || decodedUser.sub || decodedUser.email || "User",
          email: decodedUser.email || decodedUser.sub || "",
          username: decodedUser.sub || decodedUser.name || "User"
        };
        localStorage.setItem('user', JSON.stringify(userObj));
      }

      // Clean up URL
      window.history.replaceState({}, document.title, window.location.pathname);
      
      showMessage('Login successful.', 'success');
      setTimeout(() => {
        window.location.href = resolveRedirectTarget();
      }, 500);
    } else {
      const oauthErrorMessage = getOAuthErrorMessage();
      if (oauthErrorMessage) {
        showMessage(oauthErrorMessage || 'We could not complete sign-in. Please try again.', 'error');
      }
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    confirmSessionEndedBtn.addEventListener('click', function () {
      sessionEndedModal.classList.add('hidden');
      sessionEndedModal.classList.remove('flex');
    });

    // Handle Local Login submission
    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearMessage();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging In...';

      try {
        const response = await fetch(LOGIN_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json') ? await response.json() : await response.text();

        if (response.ok) {
          let jwt = typeof data === 'string' ? data : data.jwt || data.token || data.accessToken;
          if (jwt) {
            jwt = jwt.replace(/^Bearer\s+/, '');
            localStorage.setItem('jwt', jwt);
            localStorage.setItem('authToken', jwt);
          }

          // Set user object from response or fallback to decoded JWT
          let userObj = (typeof data === 'object' && data !== null && data.user) ? data.user : null;
          if (!userObj && jwt) {
            const decodedUser = parseJwt(jwt);
            if (decodedUser) {
              userObj = {
                name: decodedUser.name || decodedUser.sub || decodedUser.email || "User",
                email: decodedUser.email || decodedUser.sub || "",
                username: decodedUser.sub || decodedUser.name || "User"
              };
            }
          }

          if (userObj) {
            localStorage.setItem('user', JSON.stringify(userObj));
          }

          showMessage('Login successful.', 'success');
          setTimeout(() => {
            window.location.href = resolveRedirectTarget();
          }, 800);
        } else {
          let errorMessage = 'Login failed. Please check your credentials.';
          if (data && data.errors) {
            errorMessage = Object.values(data.errors).join(' | ');
          } else if (data && data.message) {
            errorMessage = data.message;
          } else if (data && data.error) {
            errorMessage = data.error;
          } else if (typeof data === 'string' && data.trim() !== '') {
            errorMessage = data;
          }
          showMessage(errorMessage, 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('Unable to connect to the server on localhost:8080.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    });

    googleLoginBtn.addEventListener('click', function () {
      clearMessage();
      window.location.href = GOOGLE_OAUTH_URL;
    });

    githubLoginBtn.addEventListener('click', function () {
      clearMessage();
      window.location.href = GITHUB_OAUTH_URL;
    });
  </script>

</body>
</html>
