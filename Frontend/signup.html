<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account · Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .auth-bg {
        background: linear-gradient(
          -45deg,
          #ecfdf5,
          #a7f3d0,
          #67e8f9,
          #bfdbfe,
          #ddd6fe
        );
        background-size: 400% 400%;
        animation: gradientFlow 15s ease infinite;
      }

      @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
  </head>
  <body
    class="auth-bg min-h-screen flex items-center justify-center px-3 py-6 sm:p-4"
  >
    <div class="relative z-10 w-full max-w-md">
      <!-- Logo / Brand -->
      <div class="flex flex-col items-center mb-5 sm:mb-6">
        <div
          class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white text-[0px] shadow-lg shadow-emerald-200 mb-3"
        >
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 8.5A3.5 3.5 0 0 1 8.5 5H18a2 2 0 0 1 2 2v10.5a2.5 2.5 0 0 1-2.5 2.5h-9A3.5 3.5 0 0 1 5 16.5v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.5 5A3.5 3.5 0 0 0 5 8.5 3.5 3.5 0 0 0 8.5 12H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15.5 16h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          ₨
        </div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800 text-center">Expense Tracker</h1>
        <p class="text-sm text-slate-500 mt-1 text-center">
          Create your account to get started
        </p>
      </div>

      <!-- Card -->
      <div
        class="bg-white rounded-2xl shadow-xl shadow-slate-200 border border-slate-100 p-5 sm:p-8"
      >
        <h2 class="text-xl font-bold text-slate-800 mb-1">Sign up</h2>
        <p class="text-sm text-slate-500 mb-6">
          Track your spending, one entry at a time.
        </p>

        <form id="registerForm" class="space-y-5">
          <!-- Full Name -->
          <div>
            <label
              for="fullName"
              class="block text-sm font-medium text-slate-700 mb-1.5"
              >Full Name</label
            >
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="John Doe"
              required
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
            />
          </div>

          <!-- Email -->
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-slate-700 mb-1.5"
              >Email</label
            >
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
            />
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-slate-700 mb-1.5"
              >Password</label
            >
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              minlength="8"
              required
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
            />
          </div>

          <!-- Confirm Password -->
          <div>
            <label
              for="confirmPassword"
              class="block text-sm font-medium text-slate-700 mb-1.5"
              >Confirm Password</label
            >
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter your password"
              minlength="8"
              required
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
            />
            <p id="matchError" class="hidden text-xs text-red-500 mt-1.5">
              Passwords do not match.
            </p>
          </div>

          <!-- Submit -->
          <button
            id="submitBtn"
            type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md shadow-emerald-200"
          >
            Create Account
          </button>
          <p id="formMessage" class="hidden text-sm mt-3"></p>
        </form>

        <div class="flex items-center gap-3 my-6">
          <div class="h-px flex-1 bg-slate-200"></div>
          <span class="text-xs font-medium text-slate-400">OR</span>
          <div class="h-px flex-1 bg-slate-200"></div>
        </div>

        <div class="space-y-3">
          <button
            type="button"
            id="googleSignupBtn"
            class="w-full flex min-h-11 items-center justify-center gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-emerald-200 hover:bg-slate-50 hover:shadow-md sm:px-4"
          >
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
          </button>

          <button
            type="button"
            id="githubSignupBtn"
            class="w-full flex min-h-11 items-center justify-center gap-3 rounded-lg border border-slate-800 bg-slate-950 px-3 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-slate-800 hover:shadow-md sm:px-4"
          >
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.58.1.79-.25.79-.56v-2.16c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18.92-.26 1.9-.38 2.88-.39.98.01 1.96.13 2.88.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.42-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14v3.16c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
            </svg>
            Continue with GitHub
          </button>
        </div>

        <!-- Navigation link -->
        <p class="text-sm text-slate-500 text-center mt-6">
          Already have an account?
          <a
            href="login.html"
            class="text-emerald-600 font-semibold hover:underline"
            >Log in</a
          >
        </p>
      </div>
    </div>

<script>
  const REGISTER_API_URL = "http://localhost:8080/api/auth/register";
  const GOOGLE_OAUTH_URL = "http://localhost:8080/oauth2/authorization/google";
  const GITHUB_OAUTH_URL = "http://localhost:8080/oauth2/authorization/github";
  const registerForm = document.getElementById("registerForm");
  const matchError = document.getElementById("matchError");
  const formMessage = document.getElementById("formMessage");
  const submitBtn = document.getElementById("submitBtn");
  const googleSignupBtn = document.getElementById("googleSignupBtn");
  const githubSignupBtn = document.getElementById("githubSignupBtn");

  function showMessage(message, type = "error") {
    formMessage.textContent = message;
    formMessage.className =
      type === "success"
        ? "text-sm mt-3 text-emerald-600"
        : "text-sm mt-3 text-red-500";
  }

  function clearMessage() {
    formMessage.textContent = "";
    formMessage.className = "hidden text-sm mt-3";
  }

  registerForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    clearMessage();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      matchError.classList.remove("hidden");
      showMessage("Please confirm both passwords are the same.");
      return;
    }

    matchError.classList.add("hidden");
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating Account...";

    try {
      const response = await fetch(REGISTER_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          name: fullName,
          email,
          password,
        }),
      });

      const contentType = response.headers.get("content-type") || "";
      const data = contentType.includes("application/json")
        ? await response.json()
        : await response.text();

      if (response.ok) {
        showMessage("Registration successful. Redirecting to login...", "success");
        registerForm.reset();
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1000);
      } else {
        const errorMessage =
          typeof data === "string" ? data : data.message || data.error;
        showMessage(errorMessage || "Registration failed. Please try again.");
        console.error(data);
      }
    } catch (error) {
      console.error("Error:", error);
      showMessage("Unable to connect to the server on localhost:8080.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";
    }
  });

  googleSignupBtn.addEventListener("click", function () {
    clearMessage();
    window.location.href = GOOGLE_OAUTH_URL;
  });

  githubSignupBtn.addEventListener("click", function () {
    clearMessage();
    window.location.href = GITHUB_OAUTH_URL;
  });
</script>
  </body>
</html>
