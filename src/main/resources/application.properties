spring.application.name=ExpenseTracker

# Server
server.port=8080

# ====================================================
# MySQL Database Configuration
# ====================================================
# If running Spring Boot on host (IDE / Terminal): use localhost
# If running Spring Boot inside Docker on 'my-app-network': replace 'localhost' with 'mysql_boot_dev'
spring.datasource.url=jdbc:mysql://localhost:3306/myapp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Import secret configuration
spring.config.import=optional:classpath:config.yaml

# ====================================================
# JPA / Hibernate
# ====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


logging.level.org.springframework.security=DEBUG

